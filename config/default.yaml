app:
  name: "Automate AI"
  product_name: "AI Desktop Automation"
  group_id: "S26CS089"
  version: "0.1.12-alpha"
  tagline: "Control your desktop using voice commands."

paths:
  data_dir: "data"
  db_file: "data/automation.db"
  captures_dir: "data/captures"
  templates_dir: "assets/templates"
  logs_dir: "data/logs"
  models_dir: "data/models"

ui:
  theme: "light"
  window_width: 1080
  window_height: 680
  min_width: 860
  min_height: 560

speech:
  # auto = offline Vosk (no internet) first, then Chrome, then laptop mic
  engine: auto
  wake_word: DAI
  overlay: true
  ambient_seconds: 0.08
  phrase_time_limit: 3.5
  listen_timeout: 3.5
  energy_threshold: 120
  mic_sensitivity: 0.9
  pause_threshold: 0.35
  non_speaking_duration: 0.2
  language: "en-US"
  browser_timeout: 22
  bridge_host: "127.0.0.1"
  bridge_port: 8765
  # auto | openai | gemini — used when OPENAI_API_KEY / GEMINI_API_KEY are set
  cloud_stt: auto
  openai_api_key: ""
  gemini_api_key: ""

nlp:
  spacy_model: "en_core_web_sm"
  min_confidence: 0.45

vision:
  ocr_lang: "eng"
  template_threshold: 0.72
  capture_monitor: 0

automation:
  dry_run: false
  failsafe: true
  pause_seconds: 0.04
  type_interval: 0.01
  move_duration: 0.05
  post_action_delay: 0.06
  app_launch_wait: 0.45

auth:
  # Real accounts via Sign Up — no demo user is created by default
  create_demo_user: false
  default_username: ""
  default_password: ""
  default_email: ""
  default_display_name: ""
