app:
  name: "Automate AI"
  product_name: "AI Desktop Automation"
  group_id: "S26CS089"
  version: "0.1.3-alpha"
  tagline: "Control your desktop using voice commands."

paths:
  data_dir: "data"
  db_file: "data/automation.db"
  captures_dir: "data/captures"
  templates_dir: "assets/templates"
  logs_dir: "data/logs"

ui:
  theme: "light"
  window_width: 1360
  window_height: 860
  min_width: 1180
  min_height: 720

speech:
  ambient_seconds: 0.18
  phrase_time_limit: 5
  listen_timeout: 5
  energy_threshold: 150
  mic_sensitivity: 0.85
  pause_threshold: 0.45
  non_speaking_duration: 0.25
  language: "en-US"

nlp:
  spacy_model: "en_core_web_sm"
  min_confidence: 0.45

vision:
  ocr_lang: "eng"
  template_threshold: 0.72
  capture_monitor: 0

automation:
  dry_run: false
  failsafe: true
  pause_seconds: 0.08
  type_interval: 0.015
  move_duration: 0.08
  post_action_delay: 0.12
  app_launch_wait: 0.7

auth:
  default_username: "demo"
  default_password: "demo123"
  default_email: "demo@automate.ai"
  default_display_name: "Demo User"
