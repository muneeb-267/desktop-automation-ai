app:
  name: "Automate AI"
  product_name: "AI Desktop Automation"
  group_id: "S26CS089"
  version: "0.1.2-alpha"
  tagline: "Control your desktop using voice commands."

paths:
  data_dir: "data"
  db_file: "data/automation.db"
  captures_dir: "data/captures"
  templates_dir: "assets/templates"
  logs_dir: "data/logs"

ui:
  theme: "light"
  window_width: 1360
  window_height: 860
  min_width: 1180
  min_height: 720

speech:
  ambient_seconds: 0.25
  phrase_time_limit: 6
  listen_timeout: 6
  energy_threshold: 180
  mic_sensitivity: 0.8
  pause_threshold: 0.55
  non_speaking_duration: 0.35

nlp:
  spacy_model: "en_core_web_sm"
  min_confidence: 0.45

vision:
  ocr_lang: "eng"
  template_threshold: 0.72
  capture_monitor: 0

automation:
  # Live automation ON by default — uncheck in Settings for safe dry-run
  dry_run: false
  failsafe: true
  pause_seconds: 0.12
  type_interval: 0.02
  move_duration: 0.12
  post_action_delay: 0.2
  app_launch_wait: 1.2

auth:
  default_username: "demo"
  default_password: "demo123"
  default_email: "demo@automate.ai"
  default_display_name: "Demo User"
